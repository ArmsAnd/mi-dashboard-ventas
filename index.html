<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MDY</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        -45deg,
        #ff6b00,
        #ff8c00,
        #ffa200,
        #ffb703,
        #ff7b00
    );
    background-size:400% 400%;
    animation:gradientBG 10s ease infinite;
    overflow:hidden;
}

@keyframes gradientBG {

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}
/* ---------------- OVERLAY ---------------- */

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.25);
    backdrop-filter:blur(2px);
}
/* ---------------- HEADER ---------------- */

header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:25px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
}

.contenedor-imagen{
    perspective:1000px;
}

#imagen{
    width:80px;
    transition:transform .2s ease-out;
    filter:drop-shadow(
        0 15px 25px rgba(0,0,0,.15)
    );
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:#fff;
    font-weight:500;
    transition:.3s;
}

nav a:hover{
    color:#00e5ff;
}

/* ---------------- HERO ---------------- */

.hero-text{
    position:absolute;
    left:60px;
    bottom:80px;
    max-width:550px;
    color:#fff;
    z-index:10;
}

.hero-text h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero-text p{
    line-height:1.7;
    color:rgba(255,255,255,.9);
}

/* ---------------- FORM ---------------- */

.container-form{
    position:absolute;
    right:80px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:20;
}

.btn-flecha{
    padding:12px 28px;
    border:none;
    border-radius:50px;
    background:#fff;
    color:#ff6b00;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.btn-flecha:hover{
    transform:translateY(-3px);
    box-shadow:
        0 10px 20px rgba(0,0,0,.2);
}

.contact-form{
    margin-top:20px;
    width:350px;
    padding:25px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
    transition:
        opacity .3s,
        transform .3s;
    box-shadow:
        0 15px 40px rgba(0,0,0,.2);
}

.contact-form h2{
    text-align:center;
    color:#fff;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    border:none;
    outline:none;
    padding:14px;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    color:#fff;
    border:1px solid rgba(255,255,255,.15);
}

.contact-form textarea{
    resize:none;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder{
    color:rgba(255,255,255,.7);
}

.contact-form input:focus,
.contact-form textarea:focus{
    border-color:#00d4ff;
    box-shadow:0 0 12px rgba(0,212,255,.3);
}

.contact-form button{
    background:#00d4ff;
    color:#000;
    border:none;
    padding:14px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.contact-form button:hover{
    background:#20deff;
    transform:translateY(-2px);
}

.hide{
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
}

/* ---------------- RESPONSIVE ---------------- */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    header{
        flex-direction:column;
        gap:20px;
        padding:20px;
    }

    .hero-text{
        position:relative;
        left:auto;
        bottom:auto;
        margin-top:120px;
        padding:20px;
        text-align:center;
    }

    .hero-text h1{
        font-size:2.3rem;
    }

    .container-form{
        position:relative;
        right:auto;
        top:auto;
        transform:none;
        margin:20px;
    }

    .contact-form{
        width:100%;
        max-width:350px;
    }

}

</style>
</head>

<body>

<div class="overlay"></div>

<header>

<div class="contenedor-imagen">
    <img id="imagen" src="logo.png" alt="MDY">
</div>

<nav>
    <ul>
        <li>#inicioInicio</a></li>
        <li>#serviciosServicios</a></li>
        <li>#proyectosProyectos</a></li>
        <li>#contactoContacto</a></li>
    </ul>
</nav>

</header>

<div class="hero-text">

    <h1>Descubre Nuevos Horizontes</h1>

    <p>
        Creamos experiencias digitales únicas,
        modernas y profesionales para empresas,
        marcas y emprendedores.
    </p>

</div>

<div class="container-form">

    <button id="action" class="btn-flecha">
        Contactar
    </button>

    <form
        action="https://formsubmit.co/abielandreecardenas@gmail.com"
        method="POST"
        id="mi-form"
        class="contact-form hide"
    >

        <input
            type="hidden"
            name="_subject"
            value="Nuevo mensaje desde MDY"
        >

        <input
            type="hidden"
            name="_captcha"
            value="false"
        >

        <h2>Contáctame</h2>

        <input
            type="email"
            name="email"
            placeholder="Tu correo electrónico"
            required
        >

        <textarea
            name="mensaje"
            rows="5"
            placeholder="Escribe tu mensaje..."
            required
        ></textarea>

        <button type="submit">
            Enviar
        </button>

    </form>

</div>

<script>

/* FORMULARIO */

const btn = document.getElementById("action");
const form = document.getElementById("mi-form");

btn.addEventListener("click", () => {
    form.classList.toggle("hide");
});

/* EFECTO 3D LOGO */

const imagen = document.getElementById("imagen");

document.addEventListener("mousemove", (e) => {

    const x = window.innerWidth / 2;
    const y = window.innerHeight / 2;

    const distanciaX =
        (e.clientX - x) / 25;

    const distanciaY =
        (e.clientY - y) / 25;

    imagen.style.transform = `
        rotateY(${distanciaX}deg)
        rotateX(${-distanciaY}deg)
        translateX(${distanciaX}px)
        translateY(${distanciaY}px)
    `;

});

</script>

</body>
</html>
